<style>
    body {
        background: linear-gradient(135deg, #ffb6c1, #add8e6, #e6f3ff); /* Light pink to lightest blue gradient */
        min-height: 100vh; /* Ensures the gradient covers the full viewport height */
        background-attachment: fixed; /* Keeps the gradient static while scrolling */
    }
    img {
        display: block;
        margin: 20px auto;
        max-width: 1000px;
        width: 100%;
        border-radius: 10px; /* Optional: Adds a subtle rounded corner for a modern look */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Optional: Adds a shadow for depth */
        transition: transform 0.3s ease; /* Optional: Smooth hover effect */
    }
    img:hover {
        transform: scale(1.02); /* Optional: Slight zoom on hover */
    }
    p {
        text-align: center;
        font-family: 'Poppins', sans-serif; /* Optional: Modern font for consistency */
        font-size: 18px;
        color: #1a2a6c; /* Dark blue for contrast against the light background */
    }
    p a {
        color: #ff69b4; /* Hot pink for links to stand out */
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease; /* Smooth color transition on hover */
    }
    p a:hover {
        color: #87ceeb; /* Light blue on hover for a cohesive theme */
        text-decoration: underline; /* Underline on hover for clarity */
    }
</style>
